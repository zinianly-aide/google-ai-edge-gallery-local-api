name: Android CI & Release
# Bootstrap trigger after enabling Actions on the fork.

on:
  pull_request:
    branches: ["feature/local-api-server"]
    paths:
      - "Android/**"
      - ".github/workflows/build_android.yaml"
  push:
    branches: ["feature/local-api-server"]
    paths:
      - "Android/**"
      - ".github/workflows/build_android.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./Android/src

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare build metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="google-ai-edge-gallery-local-api-v${VERSION}-build.${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        working-directory: ${{ github.workspace }}
        run: |
          mv Android/src/app/build/outputs/apk/release/app-release.apk \
             "Android/src/app/build/outputs/apk/release/${{ steps.meta.outputs.apk_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.run_number }}-${{ steps.meta.outputs.short_sha }}
          path: Android/src/app/build/outputs/apk/release/${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}-build.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Gallery Local API v${{ steps.meta.outputs.version }} build ${{ github.run_number }}
          prerelease: true
          body: |
            Automated Android CI build.

            - Version: v${{ steps.meta.outputs.version }}
            - Commit: `${{ github.sha }}`
            - CI run: #${{ github.run_number }}
            - Unit tests: passed before packaging

            Download the attached APK to install this build.
          files: Android/src/app/build/outputs/apk/release/${{ steps.meta.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
